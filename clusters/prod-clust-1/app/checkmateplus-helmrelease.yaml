apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: checkmateplus
  namespace: checkmateplus
spec:
  releaseName: checkmateplus
  interval: 5m
  targetNamespace: checkmateplus
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: checkmateplus-cloudflared-secret
      valuesKey: tunnelToken
      targetPath: cloudflared.tunnelToken
  chart:
    spec:
      chart: k8s/checkmateplus
      sourceRef:
        kind: GitRepository
        name: checkmateplus
        namespace: flux-system
      interval: 1m
  values:
    cloudflared:
      imagePullSecrets:
        - name: gitlab-registry
    frontend:
      imagePullSecrets:
        - name: gitlab-registry
    gameserver:
      imagePullSecrets:
        - name: gitlab-registry
    gameservermanager:
      imagePullSecrets:
        - name: gitlab-registry
    matchmakingservice:
      imagePullSecrets:
        - name: gitlab-registry