spring.application.name=PlayerService
# Datasource
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:checkmateplus-postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:checkmate}
spring.datasource.username=${postgresUser}
spring.datasource.password=${postgresPassword}
allowed-origins=${ALLOWED_ORIGINS:https://checkmateplus.org}
# JPA / Hibernate validate only in prod, never auto-migrate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.graphql.graphiql.enabled=false

jwt.secret=${jwtSecret}
jwt.expiry-ms=86400000
jwt.guest-expiry-ms=3600000
jwt.refresh-expiry-ms=2592000000
server.port=8095
spring.grpc.server.port=9092
logging.level.org.springframework.security=INFO
logging.level.org.springframework.messaging=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.playerservice=INFO