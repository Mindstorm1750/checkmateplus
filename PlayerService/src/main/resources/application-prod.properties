spring.application.name=PlayerService
# Datasource
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:checkmateplus-postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:checkmate}
spring.datasource.username=${postgresUser}
spring.datasource.password=${postgresPassword}
allowed-origins=${ALLOWED_ORIGINS:https://checkmateplus.org}
frontend.url=${FRONTEND_URL:https://checkmateplus.org}
# JPA / Hibernate validate only in prod, never auto-migrate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.graphql.graphiql.enabled=false

# Flyway - baseline-on-migrate skips V1 on populated prod DB
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

jwt.secret=${jwtSecret}
jwt.expiry-ms=86400000
jwt.guest-expiry-ms=3600000
jwt.refresh-expiry-ms=2592000000
server.port=8095
spring.grpc.server.port=9092
logging.level.org.springframework.security=INFO
logging.level.org.springframework.messaging=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.playerservice=INFO

gameservermanager.host=${GAMESERVERMANAGER_HOST:localhost}
gameservermanager.port=${GAMESERVERMANAGER_PORT:9090}
stockfishengine.host=${STOCKFISHENGINE_HOST:localhost}
stockfishengine.port=${STOCKFISHENGINE_PORT:9093}
analysis.enabled=${ANALYSIS_ENABLED:true}
analysis.depth=${ANALYSIS_DEPTH:16}
analysis.deadline-seconds=${ANALYSIS_DEADLINE_SECONDS:600}
analysis.queue.key=${ANALYSIS_QUEUE_KEY:analysis:queue}
analysis.queue.poll-seconds=${ANALYSIS_QUEUE_POLL_SECONDS:10}