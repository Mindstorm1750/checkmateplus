spring.application.name=PlayerService
# Datasource
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:checkmate}
spring.datasource.username=${POSTGRES_USER:checkmate}
spring.datasource.password=${POSTGRES_PASSWORD:checkmate}
allowed-origins=http://localhost:5173,http://localhost:3000
frontend.url=http://localhost:5173
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.graphql.graphiql.enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

