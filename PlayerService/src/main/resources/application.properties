spring.application.name=PlayerService
# Datasource
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:checkmate}
spring.datasource.username=${POSTGRES_USER:checkmate}
spring.datasource.password=${POSTGRES_PASSWORD:checkmate}
allowed-origins=http://localhost:5173,http://localhost:3000
frontend.url=http://localhost:5173
# JPA / Hibernate - Flyway owns schema, Hibernate validates only
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.graphql.graphiql.enabled=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

jwt.secret=QDTNT7u+qrEDSRmwTYsPawyGevb6Jpm+9j4DsJcJ/aU=
jwt.expiry-ms=86400000
jwt.guest-expiry-ms=2592000000
jwt.refresh-expiry-ms=2592000000
server.port=8095
spring.grpc.server.port=9092
gameservermanager.host=${GAMESERVERMANAGER_HOST:localhost}
gameservermanager.port=${GAMESERVERMANAGER_PORT:9090}
stockfishengine.host=${STOCKFISHENGINE_HOST:localhost}
stockfishengine.port=${STOCKFISHENGINE_PORT:9093}
analysis.enabled=${ANALYSIS_ENABLED:true}
analysis.depth=${ANALYSIS_DEPTH:16}
analysis.deadline-seconds=${ANALYSIS_DEADLINE_SECONDS:600}
analysis.queue.key=${ANALYSIS_QUEUE_KEY:analysis:queue}
analysis.queue.poll-seconds=${ANALYSIS_QUEUE_POLL_SECONDS:10}
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.messaging=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.playerservice=INFO
logging.level.org.springframework.cache=DEBUG