services:
  matchmakingservice:
    image: git.cs.kent.ac.uk:5050/jhl28/checkmate/matchmakingservice:2.1.0
    container_name: matchmakingservice
    environment:
      - jwtSecret=+/J48zc2Hq1vtHZNU+9HGXZ6vP3ZDaX4UtgNWqR7eSY=
    ports:
      - "8080:8080"
    networks:
      - game-network
    restart: unless-stopped
    depends_on:
      - redis
      - gameservermanager

  gameserver:
    image: git.cs.kent.ac.uk:5050/jhl28/checkmate/gameserver:2.1.0
    container_name: gameserver
    ports:
      - "8090:8090"
      - "9091:9091"
    environment:
      - jwtSecret=+/J48zc2Hq1vtHZNU+9HGXZ6vP3ZDaX4UtgNWqR7eSY=
    networks:
      - game-network
    restart: unless-stopped
    depends_on:
      - gameservermanager
      - playerservice

  gameservermanager:
    image: git.cs.kent.ac.uk:5050/jhl28/checkmate/gameservermanager:2.1.0
    container_name: gameservermanager
    networks:
      - game-network
    restart: unless-stopped

  playerservice:
    image: git.cs.kent.ac.uk:5050/jhl28/checkmate/playerservice:2.1.0

    container_name: playerservice
    ports:
      - "8095:8095"
      - "9092:9092"
    environment:
      - jwtSecret=+/J48zc2Hq1vtHZNU+9HGXZ6vP3ZDaX4UtgNWqR7eSY=
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=checkmate
      - postgresUser=checkmate
      - postgresPassword=checkmate
    networks:
      - game-network
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=checkmate
      - POSTGRES_PASSWORD=checkmate
      - POSTGRES_DB=checkmate
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - game-network
    restart: unless-stopped

  redis:
    image: redis:8.6.0-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - game-network
    restart: unless-stopped

networks:
  game-network:
    driver: bridge

volumes:
  postgres-data: