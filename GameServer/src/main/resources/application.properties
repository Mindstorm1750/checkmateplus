spring.application.name=GameServer
server.port=8090
spring.grpc.server.port=9091

# Manager connection
gameservermanager.host=localhost
gameservermanager.port=9090

# What to advertise to the manager
gameserver.advertise.host=localhost
gameserver.advertise.grpc-port=9091
gameserver.max-concurrent-matches=5

logging.level.org.springframework.messaging = INFO
logging.level.org.springframework.web.socket = INFO
logging.level.org.springframework.gameserver = INFO