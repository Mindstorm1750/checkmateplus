stages:          # List of stages for jobs, and their order of execution
  - build
  - test
  - secret-detection
  - native-build
  - security-test

build-job:       # This job runs in the build stage, which runs first.
  image: gradle:9.3.1-jdk25-graal
  stage: build
  script:
    - GRADLE_USER_HOME="$(pwd)/.gradle"
    - export GRADLE_USER_HOME
    - gradle --build-cache assemble
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 hour
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: push
    paths:
      - build
      - .gradle

frontend-test:
  image: node:24-alpine
  stage: test
  cache:
    key: "$CI_COMMIT_REF_NAME-frontend"
    paths:
      - frontend/node_modules/
  script:
    - cd frontend
    - npm ci
    - npm run test -- --reporter=junit --outputFile=junit.xml
  artifacts:
    reports:
      junit: frontend/junit.xml
    expire_in: 1 day

test:
  image: gradle:9.3.1-jdk25-graal
  stage: test
  script:
    - GRADLE_USER_HOME="$(pwd)/.gradle"
    - export GRADLE_USER_HOME
    - gradle check
  artifacts:
    reports:
      junit: "**/build/test-results/test/TEST-*.xml"
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle

.native-docker-image:
  image: gradle:9.3.1-jdk25-graal
  stage: native-build
  services:
    - docker:24.0.5-dind
  cache:
    key: "$CI_COMMIT_REF_NAME"
    policy: pull
    paths:
      - build
      - .gradle
  before_script:
    - GRADLE_USER_HOME="$(pwd)/.gradle"
    - export GRADLE_USER_HOME
    #- echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - gradle bootBuildImage --publishImage
      -PregistryUrl=$CI_REGISTRY
      -PregistryUsername=$CI_REGISTRY_USER
      -PregistryPassword=$CI_REGISTRY_PASSWORD



include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

sast:
  stage: security-test

dependency_scanning:
  stage: security-test

container_scanning:
  stage: security-test

secret_detection:
  stage: security-test
