{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "checkmateplus.fullname" . }}
  labels:
    {{- include "checkmateplus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "checkmateplus.selectorLabels" . | nindent 4 }}
{{- end }}