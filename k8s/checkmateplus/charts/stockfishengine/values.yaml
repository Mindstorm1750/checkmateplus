enabled: true
replicaCount: 1

image:
  repository: git.cs.kent.ac.uk:5050/jhl28/checkmate/stockfishengine
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: "checkmateplus-default"

service:
  type: ClusterIP
  httpPort: 8085
  grpcPort: 9093

env:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_PORT: "8085"
  GRPC_PORT: "9093"
  STOCKFISH_THREADS: "1"
  STOCKFISH_HASH_MB: "512"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 768Mi

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
