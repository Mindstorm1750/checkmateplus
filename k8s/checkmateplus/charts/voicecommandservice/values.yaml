enabled: true
replicaCount: 1

image:
  repository: git.cs.kent.ac.uk:5050/jhl28/checkmate/voicecommandservice
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: "checkmateplus-default"

service:
  type: ClusterIP
  httpPort: 9100

env:
  SPRING_PROFILES_ACTIVE: prod
  ALLOWED_ORIGINS: "https://checkmateplus.org"

secretName: checkmateplus-voicecommandservice-secret

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
