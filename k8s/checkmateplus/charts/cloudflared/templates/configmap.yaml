apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudflared.fullname" . }}-config
  labels:
    {{- include "cloudflared.labels" . | nindent 4 }}
data:
  config.yaml: |
    ingress:
      {{- range .Values.ingress }}
      - {{- if .hostname }}
        hostname: {{ .hostname }}
        {{- end }}
        service: {{ .service }}
      {{- end }}