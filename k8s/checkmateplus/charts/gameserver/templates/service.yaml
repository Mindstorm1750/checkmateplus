apiVersion: v1
kind: Service
metadata:
  name: {{ include "checkmateplus.fullname" . }}
  labels:
    {{- include "checkmateplus.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "checkmateplus.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: {{ .Values.service.httpPort }}
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: {{ .Values.service.grpcPort }}
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "checkmateplus.fullname" . }}-lb
  labels:
    {{- include "checkmateplus.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "checkmateplus.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: {{ .Values.service.httpPort }}
      protocol: TCP
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: {{ .Values.service.grpcPort }}
      protocol: TCP