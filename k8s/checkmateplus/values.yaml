# Default values for checkmateplus.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  registry: git.cs.kent.ac.uk:5050/jhl28/checkmate
  namespace: checkmateplus
  environment: prod
  publicDomain: checkmateplus.org

frontend:
  enabled: true
  replicas: 1
  image:
    repository: git.cs.kent.ac.uk:5050/jhl28/checkmate/frontend
    tag: RC-2.0.2
  port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    type: ClusterIP
  serviceAccount:
    create: false
    name: "checkmateplus-default"
gameserver:
  enabled: true
  image:
    repository: git.cs.kent.ac.uk:5050/jhl28/checkmate/gameserver
    tag: RC-2.0.1
  replicaCount: 1
  service:
    httpPort: 8090
    grpcPort: 9091
  env:
    GAMESERVERMANAGER_HOST: "{{ .Release.Name }}-gameservermanager"
    GAMESERVERMANAGER_PORT: "9090"
    GAMESERVER_ADVERTISE_HOST: "{{ .Release.Name }}-gameserver"
    GAMESERVER_ADVERTISE_GRPCPORT: "9091"
    GAMESERVER_MAXCONCURRENTMATCHES: "25"
    SPRING_DATA_REDIS_HOST: "{{ .Release.Name }}-redis-master"
    SPRING_DATA_REDIS_PORT: "6379"
    SPRING_PROFILES_ACTIVE: prod
    PLAYERSERVICE_HOST: "{{ .Release.Name }}-playerservice"
    PLAYERSERVICE_PORT: "9092"
  jwtSecretName: checkmateplus-playerservice-secret
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  serviceAccount:
    create: false
    name: "checkmateplus-default"

gameservermanager:
  enabled: true
  image:
    repository: git.cs.kent.ac.uk:5050/jhl28/checkmate/gameservermanager
    tag: RC-2.0.0
  replicaCount: 1
  service:
    httpPort: 8081
    grpcPort: 9090
  env:
    SPRING_PROFILES_ACTIVE: prod
    SPRING_DATA_REDIS_HOST: "{{ .Release.Name }}-redis-master"
    SPRING_DATA_REDIS_PORT: "6379"
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount:
    create: false
    name: "checkmateplus-default"

matchmakingservice:
  enabled: true
  image:
    repository: git.cs.kent.ac.uk:5050/jhl28/checkmate/matchmakingservice
    tag: RC-2.0.0
  replicaCount: 1
  service:
    httpPort: 8080
  env:
    SPRING_PROFILES_ACTIVE: prod
    GAMESERVERMANAGER_HOST: "{{ .Release.Name }}-gameservermanager"
    GAMESERVERMANAGER_PORT: "9090"
    SPRING_DATA_REDIS_HOST: "{{ .Release.Name }}-redis-master"
    SPRING_DATA_REDIS_PORT: "6379"
  jwtSecretName: checkmateplus-playerservice-secret
  resources:
    requests:
      cpu: 200m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  serviceAccount:
    create: false
    name: "checkmateplus-default"



playerservice:
  enabled: true
  image:
    repository: git.cs.kent.ac.uk:5050/jhl28/checkmate/playerservice
    tag: RC-2.0.3
  replicaCount: 1
  service:
    httpPort: 8095
    grpcPort: 9092
  env:
    SPRING_PROFILES_ACTIVE: prod
    ALLOWED_ORIGINS: "https://checkmateplus.org"
    POSTGRES_HOST: "{{ .Release.Name }}-postgresql"
    POSTGRES_PORT: "5432"
    POSTGRES_DB: "checkmate"
    SPRING_DATA_REDIS_HOST: "{{ .Release.Name }}-redis-master"
    SPRING_DATA_REDIS_PORT: "6379"
  secretName: checkmateplus-playerservice-secret
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1024Mi
  serviceAccount:
    create: false
    name: "checkmateplus-default"

cloudflared:
  enabled: true
  image:
    repository: cloudflare/cloudflared
    tag: latest
  replicaCount: 1
  tunnelToken: ""  # pass via --set at deploy time
  #THE TOKEN IS IN THE GITLAB CI/CD VARS

  #THESE BELOW ARE JUST FOR SHOW
  #THE ROUTES ARE MANAGED IN THE CLOUDFLARE CONSOLE!!!
  #THIS SUCKS, SHOULD PROB MOVE TO A COMMMUNITY
  #CLOUDFLARE GATEWAY FOR AUTO-INGRESS SUPPORT!!!
  ingress:
    - hostname: checkmateplus.org
      service: http://checkmateplus-frontend.checkmateplus.svc.cluster.local:80
    - hostname: ws.checkmateplus.org
      service: http://checkmateplus-matchmakingservice.checkmateplus.svc.cluster.local:8080
    - hostname: gs0.checkmateplus.org
      service: http://checkmateplus-gameserver-0.checkmateplus-gameserver.checkmateplus.svc.cluster.local:8090
    - service: http_status:404

postgresql:
  namespaceOverride: checkmateplus
  enabled: true
  auth:
    username: checkmateuser
    database: checkmate
    existingSecret: checkmateplus-playerservice-secret
    secretKeys:
      userPasswordKey: postgresPassword
  primary:
    initdb:
      scripts:
        01-schema.sql: |
          -- players (single-table inheritance: REGISTERED, ANONYMOUS, BOT)
          CREATE TABLE IF NOT EXISTS players (
              player_id          VARCHAR(255)       NOT NULL,
              player_type        VARCHAR(31)        NOT NULL,
              display_name       VARCHAR(255)       NOT NULL,
              joined_queue_at    BIGINT             NOT NULL,
              skill_rating       INTEGER,
              rating_deviation   DOUBLE PRECISION,
              volatility         DOUBLE PRECISION,
              player_preferences JSONB,
              difficulty         INTEGER,
              bot_configuration  JSONB,
              CONSTRAINT pk_players PRIMARY KEY (player_id)
          );

          -- accounts
          CREATE TABLE IF NOT EXISTS accounts (
              account_id        VARCHAR(255) NOT NULL,
              username          VARCHAR(255) NOT NULL,
              totp_secret       VARCHAR(255),
              totp_enabled      BOOLEAN      NOT NULL DEFAULT FALSE,
              google_id         VARCHAR(255),
              time_registered   BIGINT,
              player_id         VARCHAR(255) NOT NULL,
              CONSTRAINT pk_accounts          PRIMARY KEY (account_id),
              CONSTRAINT uq_accounts_username UNIQUE (username),
              CONSTRAINT uq_accounts_google   UNIQUE (google_id),
              CONSTRAINT uq_accounts_player   UNIQUE (player_id),
              CONSTRAINT fk_accounts_player   FOREIGN KEY (player_id) REFERENCES players (player_id)
          );

          -- refresh_tokens
          CREATE TABLE IF NOT EXISTS refresh_tokens (
              token      VARCHAR(255) NOT NULL,
              account_id VARCHAR(255) NOT NULL,
              expires_at BIGINT       NOT NULL,
              revoked    BOOLEAN      NOT NULL DEFAULT FALSE,
              CONSTRAINT pk_refresh_tokens PRIMARY KEY (token)
          );

          -- match_records
          -- Note: createdAtEpochMs uses a camelCase @Column name; PostgreSQL folds it to createdatepochms.
          CREATE TABLE IF NOT EXISTS match_records (
              match_id                  VARCHAR(255) NOT NULL,
              board_state               JSONB,
              time_control              VARCHAR(50)  NOT NULL,
              match_type                VARCHAR(50)  NOT NULL,
              bot_configuration         JSONB,
              match_outcome             VARCHAR(50)  NOT NULL,
              white_player_id           VARCHAR(255) NOT NULL,
              black_player_id           VARCHAR(255) NOT NULL,
              remaining_white_time_ms   BIGINT       NOT NULL,
              remaining_black_time_ms   BIGINT       NOT NULL,
              match_status              VARCHAR(50)  NOT NULL,
              match_history             JSONB        DEFAULT '[]',
              created_at_epoch_ms       BIGINT       NOT NULL,
              CONSTRAINT pk_match_records       PRIMARY KEY (match_id),
              CONSTRAINT fk_match_white_player  FOREIGN KEY (white_player_id) REFERENCES players (player_id),
              CONSTRAINT fk_match_black_player  FOREIGN KEY (black_player_id) REFERENCES players (player_id)
          );

          CREATE INDEX IF NOT EXISTS idx_match_records_white ON match_records (white_player_id);
          CREATE INDEX IF NOT EXISTS idx_match_records_black ON match_records (black_player_id);
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

redis:
  namespaceOverride: checkmateplus
  enabled: true
  auth:
    enabled: false
  master:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
  replica:
    replicaCount: 1

