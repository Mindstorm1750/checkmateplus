spring.application.name=VoiceCommandService
server.port=9100
spring.grpc.server.port=9101

# Manager connection
voicecommandservice.host=localhost
voicecommandservice.port=9100

# What to advertise to the manager
gameserver.advertise.host=localhost
gameserver.advertise.grpc-port=9101
gameserver.max-concurrent-matches=5
# GameServer connection
gameserver.url=http://localhost:8090

logging.level.org.springframework.messaging = INFO
logging.level.org.springframework.web.socket = INFO
logging.level.org.springframework.gameserver = INFO

# openai library config
openai.base-url=https://api.openai.com/v1
